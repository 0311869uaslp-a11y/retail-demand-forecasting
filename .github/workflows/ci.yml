name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Verify environment
        run: |
          python --version
          python -c "import pandas; print('pandas:', pandas.__version__)"
          python -c "import fastapi; print('fastapi:', fastapi.__version__)"
          python -c "import xgboost; print('xgboost:', xgboost.__version__)"

      - name: Run tests
        run: python -m pytest -v

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t retail-demand-api:${{ github.sha }} .

      - name: Verify Docker image
        run: |
          docker image inspect retail-demand-api:${{ github.sha }}

  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs:
      - test
      - docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/retail-demand-forecasting:latest \
            -t ghcr.io/${{ github.repository_owner }}/retail-demand-forecasting:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/retail-demand-forecasting:latest
          docker push ghcr.io/${{ github.repository_owner }}/retail-demand-forecasting:${{ github.sha }}